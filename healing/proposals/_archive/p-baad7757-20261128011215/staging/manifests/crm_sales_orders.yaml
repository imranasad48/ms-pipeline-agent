manifest_version: 1
pipeline_id: crm_sales_orders
brief: "Ingest the daily CRM sales orders CSV files into the warehouse as a table named sales_orders."
created: "2026-11-13"
sources:
  - id: crm_sales_orders_csv
    format: csv
    path_pattern: "${DATA_ROOT}/crm/sales_orders_*.csv"
    expected_schema:
      order_line_id: string
      order_id: string
      order_date: string
      order_datetime: string
      customer_id: string
      warehouse_id: string
      line_no: int64
      product_id: string
      sku: string
      quantity: int64
      uom: string
      unit_price: float64
      discount_pct: float64
      line_total: float64
      currency: string
      is_cold_chain: int64
      requested_delivery_date: string
      order_status: string
      priority: string
      sales_rep: string
      channel: string
      payment_terms_days: int64
      has_cold_chain_items: int64
    observed:
      files: 90
      total_rows: 10082
      null_rates:
        order_line_id: 0.0
        order_id: 0.0
        order_date: 0.0
        order_datetime: 0.0
        customer_id: 0.0
        warehouse_id: 0.0
        line_no: 0.0
        product_id: 0.0
        sku: 0.0
        quantity: 0.0
        uom: 0.0
        unit_price: 0.0
        discount_pct: 0.0
        line_total: 0.0
        currency: 0.0
        is_cold_chain: 0.0
        requested_delivery_date: 0.0
        order_status: 0.0
        priority: 0.0
        sales_rep: 0.0
        channel: 0.0
        payment_terms_days: 0.0
        has_cold_chain_items: 0.0
steps:
  - id: extract
    file: dags/crm_sales_orders/pipeline.py
    function: extract
    description: "Read all crm/sales_orders_*.csv files as raw strings, verify required columns, tag each row with source_file, stage to pickle."
  - id: transform
    file: dags/crm_sales_orders/pipeline.py
    function: transform
    description: "Cast columns to expected types (int/float/string), trim strings, add loaded_at lineage timestamp; row count preserved."
  - id: load
    file: dags/crm_sales_orders/pipeline.py
    function: load
    description: "Full reload into SQLite: build sales_orders__new (PK order_line_id, NOT NULL), atomically swap to sales_orders, add indexes."
  - id: validate
    file: dags/crm_sales_orders/pipeline.py
    function: validate
    description: "Run all validation_checks against the loaded table; raise (fail the DAG run) on any failure."
validation_checks:
  - id: row_count_match
    type: row_count
    description: "Table row count equals total rows across all source files (and > 0)."
    params: {table: sales_orders, expected: source_total_rows, build_value: 10082}
  - id: row_count_per_file
    type: row_count
    description: "Rows per source_file in the table equal rows read from each file."
    params: {table: sales_orders, group_by: source_file}
  - id: pk_unique_order_line_id
    type: unique
    description: "order_line_id is unique (primary key)."
    params: {columns: [order_line_id]}
  - id: unique_order_id_line_no
    type: unique
    description: "(order_id, line_no) is unique."
    params: {columns: [order_id, line_no]}
  - id: schema_columns_present
    type: schema
    description: "All expected source columns exist in the table."
    params: {columns: expected_schema}
  - id: not_null_required
    type: not_null
    description: "No NULLs in any source column."
    params: {columns: all_expected_schema_columns}
  - id: accepted_values_order_status
    type: accepted_values
    description: "order_status in allowed set."
    params: {column: order_status, values: [confirmed, picked, shipped, delivered, invoiced]}
  - id: accepted_values_priority
    type: accepted_values
    description: "priority in allowed set."
    params: {column: priority, values: [standard, urgent]}
  - id: accepted_values_channel
    type: accepted_values
    description: "channel in allowed set."
    params: {column: channel, values: [edi, field_rep, phone, portal]}
  - id: accepted_values_currency
    type: accepted_values
    description: "currency in allowed set."
    params: {column: currency, values: [PKR]}
  - id: range_quantity_positive
    type: range
    description: "quantity > 0."
    params: {column: quantity, min_exclusive: 0}
  - id: range_unit_price_positive
    type: range
    description: "unit_price > 0."
    params: {column: unit_price, min_exclusive: 0}
  - id: range_discount_pct
    type: range
    description: "0 <= discount_pct <= 1."
    params: {column: discount_pct, min: 0, max: 1}
  - id: line_total_consistent
    type: expression
    description: "line_total equals round(quantity*unit_price*(1-discount_pct),2) within tolerance."
    params: {expression: "ABS(ROUND(quantity*unit_price*(1-discount_pct),2) - line_total)", max: 0.02}
  - id: order_date_matches_file
    type: lineage
    description: "order_date equals the date embedded in the source filename."
    params: {column: order_date, file_regex: 'sales_orders_(\d{4}-\d{2}-\d{2})\.csv$'}
destination:
  type: sqlite
  table: sales_orders
  path: "${WAREHOUSE_DB}"
build:
  test_db: ./warehouse/test_build.db
  attempts_used: 1
  status: success
version: 1
