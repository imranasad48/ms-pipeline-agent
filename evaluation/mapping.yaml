# Hand-written mapping: generator failure type -> which detection checks should catch it.
# This file is the scorer's ONLY statement of what "caught" means. It is written from the
# check families' documented behaviour (detection/config.yaml, detection/checks/*), NOT
# tuned against results -- change it only with a written reason.
#
# Check ids look like  <family>.<kind>[:<detail>]  (e.g. schema.renamed:quantity->qty).
# Patterns are fnmatch globs against the full check_id.
#
#   checks      PRIMARY patterns. An incident matching one of these, on the injection's
#               source, date and file, marks the injection CAUGHT (counts for recall).
#   collateral  patterns that are legitimate *consequences* of the injection (a rename shows
#               up as missing+new column). They make an incident a true positive for
#               PRECISION but never mark an injection caught.
#   blind       true => no current check family can see this failure by design. Injections
#               are reported 'uncovered' (never 'missed', never dropped). We still record
#               whether some unrelated incident happened to flag the same file ("incidental").
#   kind        domain_event types are scored inversely (should NOT be flagged).
#   needs_records  true => the injection acts on records, so a target file with ZERO records
#               (e.g. an empty hourly 3PL window) carries no observable effect: 'uncovered'.
#   date_window_days  allowed |incident date - injection date| (default 0).

# Generator artifact id -> detection source_id. null = no manifest covers that artifact, so
# the watcher cannot see it at all: injections there are 'uncovered (unmonitored artifact)'.
artifact_sources:
  crm.sales_orders: crm_sales_orders_csv
  tpl.shipments: tpl_shipment_events_json
  iot.readings: iot_readings
  manual.stock_count: manual_stock_count
  erp.products: erp_products
  crm.customers: null
  manual.vendor_prices: null
  erp.inventory_movements: null
  erp.batches: null
  erp.suppliers: null
  erp.warehouses: null
  erp.warehouse_zones: null
  erp.purchase_orders: null
  erp.purchase_order_lines: null

# Artifacts whose source format the detector does NOT parse get freshness checks only, so types
# whose primary checks are content checks are 'uncovered' there. DETECTION V2: the detector now
# parses jsonl (IoT) and xlsx (manual stock counts) -- detection/readers.py CONTENT_FORMATS --
# so the list is empty. (manual.vendor_prices has no manifest at all: still `null` above.)
freshness_only_artifacts: []

# Incidents whose check family is environmental (about the live warehouse, not the scenario
# data). They are listed in results but excluded from precision.
environmental_check_prefixes: ["run_health."]

types:
  # ---------------- SCHEMA DRIFT ----------------
  schema_rename_column:
    needs_records: true
    checks: ["schema.renamed:*", "schema.missing_column:*"]   # low name-similarity => reported as missing
    collateral: ["schema.new_column:*"]
  schema_drop_column:
    needs_records: true
    checks: ["schema.missing_column:*"]
  schema_type_change:
    needs_records: true
    checks: ["schema.type_change:*"]
  schema_new_column:
    needs_records: true
    checks: ["schema.new_column:*"]
  schema_reorder_columns:
    needs_records: true
    checks: ["schema.column_order*"]

  # ---------------- DATA QUALITY ----------------
  # DETECTION V2: written from the design of the new checks (detection/README.md), before any
  # v2 scenario result was scored. Collateral = what the failure legitimately causes elsewhere.
  dq_null_spike:
    checks: ["nulls.spike:*"]
    # Added after the first v2 scoring, with its reason: nulling an IoT `timestamp` makes those
    # readings unplaceable in time, so the per-device cadence shows holes -- a true consequence.
    collateral: ["iot.cadence_gap"]
  dq_duplicate_rows:
    checks: ["duplicates.*"]             # repeated manifest-declared keys within a day's data
    # Added after the first v2 scoring, with its reason: a re-delivered row is appended after the
    # file's last record, so it is also out of chronological order.
    collateral: ["volume.row_count", "ordering.non_monotonic:*"]
  dq_negative_quantity:
    checks: ["value_range.out_of_bounds:*"]   # manifest range min 0 / learned envelope
  dq_out_of_range:
    checks: ["value_range.out_of_bounds:*"]
  dq_referential_break:
    checks: ["referential.*"]            # child key (3pl.sales_order_id, customer_id, ...) not in parent
  dq_unit_change:
    checks: ["value_range.out_of_bounds:*"]   # C->F / PKR->USD shifts every value out of the envelope

  # ---------------- TIMING / DELIVERY ----------------
  timing_late_file:
    checks: ["freshness.late_file"]
  timing_missing_file:    # absent / 0-byte / truncated
    checks: ["freshness.missing_file", "freshness.empty_file", "freshness.truncated_file",
             "freshness.unreadable_file"]
  timing_stale_data:
    checks: ["stale.identical_to_previous"]   # records identical to the previous period's file
    # A re-sent payload is, by construction, also: events present twice (duplicate keys), events
    # outside the page's window, orders missing from the parent CRM file (orphans), a wrong row count.
    collateral: ["duplicates.*", "ordering.out_of_window:*", "referential.*", "volume.row_count"]
  timing_out_of_order:
    checks: ["ordering.non_monotonic:*", "ordering.out_of_window:*"]

  # ---------------- IOT ----------------
  iot_sensor_dropout:
    checks: ["iot.cadence_gap", "volume.row_count"]   # per-device silence; fewer rows
  iot_flatline:
    checks: ["iot.flatline"]             # zero-variance run of one device's readings
  iot_battery_death:
    # battery decays below the learned envelope; <12% the logger drops temp/humidity (nulls); then silence
    checks: ["value_range.out_of_bounds:battery_level", "nulls.spike:temperature_c",
             "nulls.spike:humidity_pct", "iot.cadence_gap"]
    collateral: ["value_range.out_of_bounds:*", "nulls.spike:*", "volume.row_count"]
  iot_corrupt_json_line:
    checks: ["schema.corrupt_line", "freshness.truncated_file", "freshness.unreadable_file",
             "volume.row_count"]

  # ---------------- EXCEL / HUMAN ----------------
  excel_date_formats:
    checks: ["schema.type_change:*"]     # date columns parsed against the declared date dtype
  excel_trailing_spaces:
    blind: true        # whitespace is not inspected (not part of detection v2)
  excel_typo_product_codes:
    blind: true        # hand-keyed near-miss codes need a reference-code/edit-distance check (not in v2)
  excel_renamed_sheet:
    checks: ["schema.sheet_renamed", "freshness.*", "schema.missing_column:*", "volume.row_count"]
  excel_merged_header:
    checks: ["schema.header_row_shift", "schema.*", "freshness.*", "volume.row_count"]

  # ---------------- DOMAIN EVENTS (not data errors; must NOT be flagged) ----------------
  domain_temp_excursion:
    kind: domain_event
  domain_delivery_delay:
    kind: domain_event
  domain_expired_batch_in_stock:
    kind: domain_event
