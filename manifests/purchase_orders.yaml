manifest_version: 1
pipeline_id: purchase_orders
brief: "Combine the ERP purchase orders with their purchase order lines into one warehouse table with one row per purchase order line, carrying the order-level fields (supplier, dates, status and similar) onto each line. Every line must match exactly one purchase order. Keep all source columns with sensible types. Add a loaded_at column holding the UTC timestamp of the load. Name the table purchase_order_lines."
created: "2026-11-28"
sources:
  - id: erp_purchase_order_lines
    format: sqlite
    path_pattern: "${DATA_ROOT}/erp/erp.db#purchase_order_lines"
    expected_schema:
      po_line_id: string
      po_id: string
      line_no: int64
      product_id: string
      ordered_qty: int64
      received_qty: int64
      unit_cost: float64
      currency: string
      line_status: string
    observed:
      files: 1
      total_rows: 1764
      null_rates:
        po_line_id: 0.0
        po_id: 0.0
        line_no: 0.0
        product_id: 0.0
        ordered_qty: 0.0
        received_qty: 0.0
        unit_cost: 0.0
        currency: 0.0
        line_status: 0.0
  - id: erp_purchase_orders
    format: sqlite
    path_pattern: "${DATA_ROOT}/erp/erp.db#purchase_orders"
    expected_schema:
      po_id: string
      supplier_id: string
      warehouse_id: string
      order_date: date
      expected_date: date
      status: string
      total_value: float64
      currency: string
      buyer: string
      incoterm: string
      created_at: datetime
    observed:
      files: 1
      total_rows: 564
      null_rates:
        po_id: 0.0
        supplier_id: 0.0
        warehouse_id: 0.0
        order_date: 0.0
        expected_date: 0.0
        status: 0.0
        total_value: 0.0
        currency: 0.0
        buyer: 0.0
        incoterm: 0.0
        created_at: 0.0
steps:
  - id: extract
    file: dags/purchase_orders/pipeline.py
    function: extract
    description: "Read erp.db purchase_order_lines and purchase_orders (read-only), check required columns, stage both."
  - id: transform
    file: dags/purchase_orders/pipeline.py
    function: transform
    description: "Enforce types (ISO dates/timestamps), rename PO currency to po_currency, fail on duplicate po_id/po_line_id or orphan lines, many-to-one join lines->orders, add loaded_at (UTC)."
  - id: load
    file: dags/purchase_orders/pipeline.py
    function: load
    description: "Drop and recreate warehouse table purchase_order_lines (full reload) with po_line_id primary key."
  - id: validate
    file: dags/purchase_orders/pipeline.py
    function: validate
    description: "Run all validation_checks; raise on failure."
validation_checks:
  - id: row_count_equals_source_lines
    type: row_count
    description: "Row count equals source purchase_order_lines row count (and > 0)."
    params: {table: purchase_order_lines, expected: source_purchase_order_lines_count, build_value: 1764}
  - id: pk_unique_po_line_id
    type: unique
    description: "po_line_id is unique."
    params: {columns: [po_line_id]}
  - id: unique_po_id_line_no
    type: unique
    description: "(po_id, line_no) is unique."
    params: {columns: [po_id, line_no]}
  - id: line_matches_exactly_one_po
    type: referential_integrity
    description: "Every source line has exactly one matching purchase order (no orphans, no duplicate po_id); transform also fails fast."
    params: {child: purchase_order_lines.po_id, parent: purchase_orders.po_id, cardinality: exactly_one}
  - id: schema_columns_present
    type: schema
    description: "All 9 line columns + 10 order-level columns (order currency as po_currency) + loaded_at, in order."
    params: {columns: [po_line_id, po_id, line_no, product_id, ordered_qty, received_qty, unit_cost, currency, line_status, supplier_id, warehouse_id, order_date, expected_date, status, total_value, po_currency, buyer, incoterm, created_at, loaded_at]}
  - id: not_null_required
    type: not_null
    description: "Key and order-level required columns are non-null."
    params: {columns: [po_line_id, po_id, line_no, product_id, ordered_qty, supplier_id, warehouse_id, order_date, status, loaded_at]}
  - id: valid_dates
    type: format
    description: "order_date/expected_date are valid YYYY-MM-DD; created_at is a valid ISO timestamp."
    params: {date_columns: [order_date, expected_date], timestamp_columns: [created_at]}
  - id: qty_sums_match_source
    type: aggregate_equality
    description: "SUM(ordered_qty) and SUM(received_qty) equal the source line totals."
    params: {columns: [ordered_qty, received_qty]}
  - id: order_fields_match_source
    type: consistency
    description: "supplier_id, status, total_value on each line equal the parent purchase order's values."
    params: {columns: [supplier_id, status, total_value], key: po_id}
  - id: loaded_at_single_utc
    type: format
    description: "loaded_at holds one non-null UTC ISO-8601 timestamp (suffix Z) for the whole load."
    params: {column: loaded_at, format: "%Y-%m-%dT%H:%M:%SZ"}
destination:
  type: sqlite
  table: purchase_order_lines
  path: "${WAREHOUSE_DB}"
build:
  test_db: ./warehouse/test_build.db
  attempts_used: 1
  status: success
version: 1
